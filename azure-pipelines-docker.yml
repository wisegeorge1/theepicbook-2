# ============================================================
# EpicBook Docker Compose CI/CD Pipeline
# Cloud: Microsoft Azure
# OS: Ubuntu Linux
# SSH user: azureuser
# SSH authentication: Password via Azure DevOps secret
# Project directory: /home/azureuser/theepicbook-2
# Public entry point: Nginx on TCP/80
# ============================================================

trigger:
  branches:
    include:
      - capstone/theepicbook-docker
  paths:
    include:
      - backend/**
      - frontend/**
      - proxy/**
      - docker-compose.yml
      - azure-pipelines-docker.yml

pool:
  vmImage: ubuntu-latest

variables:
  - group: Epicbook-docker-secrets

  - name: vmUser
    value: azureuser

  - name: projectDir
    value: /home/azureuser/theepicbook-2

  - name: imageTag
    value: $(Build.BuildId)

  - name: backendImage
    value: epicbook-2-backend

  - name: frontendImage
    value: epicbook-2-frontend

stages:

# ============================================================
# STAGE 1: BUILD AND PUSH
# ============================================================

- stage: BuildAndPush
  displayName: Build and Push Docker Images
  jobs:
    - job: Build
      displayName: Build Backend and Frontend
      steps:
        - checkout: self

        - script: |
            set -euo pipefail
            echo "$DOCKER_HUB_TOKEN" |
              docker login \
                --username "$DOCKER_HUB_USERNAME" \
                --password-stdin
          displayName: Login to Docker Hub
          env:
            DOCKER_HUB_USERNAME: $(dockerHubUsername)
            DOCKER_HUB_TOKEN: $(dockerHubToken)

        - script: |
            set -euo pipefail

            docker build \
              -t "$(dockerHubUsername)/$(backendImage):$(imageTag)" \
              -t "$(dockerHubUsername)/$(backendImage):latest" \
              ./backend

            docker push \
              "$(dockerHubUsername)/$(backendImage):$(imageTag)"

            docker push \
              "$(dockerHubUsername)/$(backendImage):latest"
          displayName: Build and Push Backend Image

        - script: |
            set -euo pipefail

            docker build \
              -t "$(dockerHubUsername)/$(frontendImage):$(imageTag)" \
              -t "$(dockerHubUsername)/$(frontendImage):latest" \
              ./frontend

            docker push \
              "$(dockerHubUsername)/$(frontendImage):$(imageTag)"

            docker push \
              "$(dockerHubUsername)/$(frontendImage):latest"
          displayName: Build and Push Frontend Image

# ============================================================
# STAGE 2: PREPARE SSH PASSWORD AUTHENTICATION
# ============================================================

- stage: PrepareDeployment
  displayName: Prepare SSH Password Authentication
  dependsOn: BuildAndPush
  jobs:
    - job: PrepareSSH
      displayName: Install sshpass
      steps:
        - checkout: none

        - script: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
            sshpass -V
          displayName: Install sshpass

# ============================================================
# STAGE 3: DEPLOY TO AZURE VM
# ============================================================

- stage: Deploy
  displayName: Deploy EpicBook to Azure VM
  dependsOn: PrepareDeployment
  jobs:
    - job: DeployStack
      displayName: Deploy Docker Compose Services
      steps:
        - checkout: self

        - script: |
            set -euo pipefail

            export SSHPASS="$VM_PASSWORD"
            SSH_TARGET="${VM_USER}@${VM_PUBLIC_IP}"
            REMOTE_DIR="$PROJECT_DIR"

            SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

            echo "Checking SSH connectivity..."

            sshpass -e ssh $SSH_OPTS "$SSH_TARGET" \
              "test -d '$REMOTE_DIR' && whoami"

            echo "SSH authentication successful."
          displayName: Verify SSH Password Authentication
          env:
            VM_PASSWORD: $(vmPassword)
            VM_USER: $(vmUser)
            VM_PUBLIC_IP: $(vmPublicIp)
            PROJECT_DIR: $(projectDir)

        - script: |
            set -euo pipefail

            export SSHPASS="$VM_PASSWORD"
            SSH_TARGET="${VM_USER}@${VM_PUBLIC_IP}"
            REMOTE_DIR="$PROJECT_DIR"

            SSH_OPTS="-o StrictHostKeyChecking=accept-new"

            sshpass -e ssh $SSH_OPTS "$SSH_TARGET" \
              "mkdir -p '$REMOTE_DIR/proxy' '$REMOTE_DIR/logs/nginx'"

            sshpass -e scp $SSH_OPTS \
              docker-compose.yml \
              "$SSH_TARGET:$REMOTE_DIR/docker-compose.yml"

            sshpass -e scp $SSH_OPTS \
              proxy/nginx.conf \
              "$SSH_TARGET:$REMOTE_DIR/proxy/nginx.conf"

            echo "Compose and Nginx configuration copied."
          displayName: Copy Deployment Configuration
          env:
            VM_PASSWORD: $(vmPassword)
            VM_USER: $(vmUser)
            VM_PUBLIC_IP: $(vmPublicIp)
            PROJECT_DIR: $(projectDir)

        - script: |
            set -euo pipefail

            export SSHPASS="$VM_PASSWORD"
            SSH_TARGET="${VM_USER}@${VM_PUBLIC_IP}"
            REMOTE_DIR="$PROJECT_DIR"
            OVERRIDE="$(Agent.TempDirectory)/docker-compose.ci.yml"

            cat > "$OVERRIDE" <<EOF
            services:
              backend:
                image: $(dockerHubUsername)/$(backendImage):$(imageTag)
              frontend:
                image: $(dockerHubUsername)/$(frontendImage):$(imageTag)
            EOF

            sshpass -e scp \
              -o StrictHostKeyChecking=accept-new \
              "$OVERRIDE" \
              "$SSH_TARGET:$REMOTE_DIR/docker-compose.ci.yml"

            sshpass -e ssh \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_TARGET" "
                set -e
                cd '$REMOTE_DIR'

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  config --quiet

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  pull backend frontend

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  up -d --remove-orphans

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  ps
              "

            echo "Deployment commands completed."
          displayName: Pull Images and Deploy Stack
          env:
            VM_PASSWORD: $(vmPassword)
            VM_USER: $(vmUser)
            VM_PUBLIC_IP: $(vmPublicIp)
            PROJECT_DIR: $(projectDir)

# ============================================================
# STAGE 4: VERIFY PUBLIC APPLICATION AND BACKEND API
# ============================================================

- stage: Verify
  displayName: Verify EpicBook Deployment
  dependsOn: Deploy
  jobs:
    - job: VerifyDeployment
      displayName: Verify Nginx and Backend Health
      steps:
        - checkout: none

        - script: |
            set -euo pipefail

            BASE_URL="http://${VM_PUBLIC_IP}"

            check_endpoint() {
              local path="$1"
              local expected="$2"
              local status

              status=$(curl -sS \
                --max-time 15 \
                -o /tmp/epicbook-response.txt \
                -w '%{http_code}' \
                "$BASE_URL$path") || {
                  echo "FAIL: Cannot reach $BASE_URL$path"
                  return 1
                }

              printf '%-25s HTTP %s\n' "$path" "$status"

              if [[ "$status" != "$expected" ]]; then
                echo "FAIL: Expected HTTP $expected for $path"
                cat /tmp/epicbook-response.txt
                return 1
              fi

              echo "PASS: $path"
            }

            echo "Waiting for deployment to stabilize..."
            sleep 15

            echo "===== PUBLIC ENDPOINT VERIFICATION ====="
            check_endpoint "/" "200"
            check_endpoint "/health" "200"

            echo
            echo "===== DEPLOYMENT SUMMARY ====="
            echo "Cloud provider : Microsoft Azure"
            echo "VM user        : $VM_USER"
            echo "Public URL     : $BASE_URL/"
            echo "Reverse proxy  : Nginx"
            echo "Backend health : HTTP 200"
            echo "Image tag      : $IMAGE_TAG"
            echo "Result         : SUCCESS"
          displayName: Verify Public Application and API
          env:
            VM_PUBLIC_IP: $(vmPublicIp)
            VM_USER: $(vmUser)
            IMAGE_TAG: $(imageTag)