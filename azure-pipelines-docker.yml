# ============================================================
# EpicBook Docker Compose CI/CD Pipeline
# Cloud: Microsoft Azure
# OS: Ubuntu Linux
# SSH user: azureuser
# SSH authentication: Azure DevOps secret variable
# Project directory: /home/azureuser/theepicbook-2
# Public entry point: Nginx on TCP/80
# ============================================================

trigger:
  branches:
    include:
      - capstone/theepicbook-docker
  paths:
    include:
      - backend/**
      - frontend/**
      - proxy/**
      - docker-compose.yml
      - azure-pipelines-docker.yml

pool:
  vmImage: ubuntu-latest

variables:
  - group: Epicbook-docker-secrets

  - name: vmUser
    value: azureuser

  - name: projectDir
    value: /home/azureuser/theepicbook-2

  - name: imageTag
    value: $(Build.BuildId)

  - name: backendImage
    value: epicbook-2-backend

  - name: frontendImage
    value: epicbook-2-frontend

stages:

  # ==========================================================
  # STAGE 1: BUILD AND PUSH DOCKER IMAGES
  # ==========================================================

  - stage: BuildAndPush
    displayName: Build and Push Docker Images
    jobs:
      - job: Build
        displayName: Build Backend and Frontend
        steps:
          - checkout: self

          # Authenticate the build agent to Docker Hub.
          - bash: |
              set -euo pipefail

              printf '%s' "$DOCKER_HUB_TOKEN" |
                docker login \
                  --username "$DOCKER_HUB_USERNAME" \
                  --password-stdin

              echo "Docker Hub login successful."
            displayName: Login to Docker Hub
            env:
              DOCKER_HUB_USERNAME: $(dockerHubUsername)
              DOCKER_HUB_TOKEN: $(dockerHubToken)

          # Build and push backend.
          - bash: |
              set -euo pipefail

              IMAGE="$DOCKER_HUB_USERNAME/$BACKEND_IMAGE"

              docker build \
                -t "$IMAGE:$IMAGE_TAG" \
                -t "$IMAGE:latest" \
                ./backend

              docker push "$IMAGE:$IMAGE_TAG"
              docker push "$IMAGE:latest"

              echo "Backend image pushed successfully."
            displayName: Build and Push Backend Image
            env:
              DOCKER_HUB_USERNAME: $(dockerHubUsername)
              BACKEND_IMAGE: $(backendImage)
              IMAGE_TAG: $(imageTag)

          # Build and push frontend.
          - bash: |
              set -euo pipefail

              IMAGE="$DOCKER_HUB_USERNAME/$FRONTEND_IMAGE"

              docker build \
                -t "$IMAGE:$IMAGE_TAG" \
                -t "$IMAGE:latest" \
                ./frontend

              docker push "$IMAGE:$IMAGE_TAG"
              docker push "$IMAGE:latest"

              echo "Frontend image pushed successfully."
            displayName: Build and Push Frontend Image
            env:
              DOCKER_HUB_USERNAME: $(dockerHubUsername)
              FRONTEND_IMAGE: $(frontendImage)
              IMAGE_TAG: $(imageTag)

  # ==========================================================
  # STAGE 2: DEPLOY TO AZURE VM
  # ==========================================================

  - stage: Deploy
    displayName: Deploy EpicBook to Azure VM
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: DeployStack
        displayName: Deploy Docker Compose Services
        steps:
          - checkout: self

          # Install sshpass on the agent that runs SSH commands.
          - bash: |
              set -euo pipefail

              sudo apt-get update -qq
              sudo apt-get install -y sshpass

              sshpass -V
            displayName: Install sshpass

          # Verify SSH connectivity and the remote project directory.
          - bash: |
              set -euo pipefail

              export SSHPASS="$VM_PASSWORD"

              SSH_TARGET="${VM_USER}@${VM_PUBLIC_IP}"
              REMOTE_DIR="$PROJECT_DIR"

              SSH_OPTS=(
                -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15
                -o PreferredAuthentications=password
                -o PubkeyAuthentication=no
              )

              echo "Checking SSH connectivity..."

              sshpass -e ssh "${SSH_OPTS[@]}" "$SSH_TARGET" \
                "test -d '$REMOTE_DIR' && whoami"

              echo "SSH authentication successful."
            displayName: Verify SSH Password Authentication
            env:
              VM_PASSWORD: $(vmPassword)
              VM_USER: $(vmUser)
              VM_PUBLIC_IP: $(vmPublicIp)
              PROJECT_DIR: $(projectDir)

          # Copy the Compose and Nginx configuration files.
          - bash: |
              set -euo pipefail

              export SSHPASS="$VM_PASSWORD"

              SSH_TARGET="${VM_USER}@${VM_PUBLIC_IP}"
              REMOTE_DIR="$PROJECT_DIR"

              SSH_OPTS=(
                -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15
              )

              sshpass -e ssh "${SSH_OPTS[@]}" "$SSH_TARGET" \
                "mkdir -p '$REMOTE_DIR/proxy' '$REMOTE_DIR/logs/nginx'"

              sshpass -e scp "${SSH_OPTS[@]}" \
                docker-compose.yml \
                "$SSH_TARGET:$REMOTE_DIR/docker-compose.yml"

              sshpass -e scp "${SSH_OPTS[@]}" \
                proxy/nginx.conf \
                "$SSH_TARGET:$REMOTE_DIR/proxy/nginx.conf"

              echo "Deployment configuration copied."
            displayName: Copy Deployment Configuration
            env:
              VM_PASSWORD: $(vmPassword)
              VM_USER: $(vmUser)
              VM_PUBLIC_IP: $(vmPublicIp)
              PROJECT_DIR: $(projectDir)

          # Generate a Compose override containing the new image tags.
          - bash: |
              set -euo pipefail

              OVERRIDE="$(Agent.TempDirectory)/docker-compose.ci.yml"

              cat > "$OVERRIDE" <<EOF
              services:
                backend:
                  image: ${DOCKER_HUB_USERNAME}/${BACKEND_IMAGE}:${IMAGE_TAG}
                frontend:
                  image: ${DOCKER_HUB_USERNAME}/${FRONTEND_IMAGE}:${IMAGE_TAG}
              EOF

              echo "Generated Compose override:"
              cat "$OVERRIDE"
            displayName: Generate Deployment Compose Override
            env:
              DOCKER_HUB_USERNAME: $(dockerHubUsername)
              BACKEND_IMAGE: $(backendImage)
              FRONTEND_IMAGE: $(frontendImage)
              IMAGE_TAG: $(imageTag)

          # Copy the Compose override to the VM.
          - bash: |
              set -euo pipefail

              export SSHPASS="$VM_PASSWORD"

              SSH_TARGET="${VM_USER}@${VM_PUBLIC_IP}"
              REMOTE_DIR="$PROJECT_DIR"
              OVERRIDE="$(Agent.TempDirectory)/docker-compose.ci.yml"

              sshpass -e scp \
                -o StrictHostKeyChecking=accept-new \
                "$OVERRIDE" \
                "$SSH_TARGET:$REMOTE_DIR/docker-compose.ci.yml"

              echo "Compose override copied."
            displayName: Copy Compose Override
            env:
              VM_PASSWORD: $(vmPassword)
              VM_USER: $(vmUser)
              VM_PUBLIC_IP: $(vmPublicIp)
              PROJECT_DIR: $(projectDir)

          # Authenticate the VM to Docker Hub and deploy the stack.
          # This also supports private Docker Hub repositories.
          - bash: |
              set -euo pipefail

              export SSHPASS="$VM_PASSWORD"

              SSH_TARGET="${VM_USER}@${VM_PUBLIC_IP}"
              REMOTE_DIR="$PROJECT_DIR"

              SSH_OPTS=(
                -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15
              )

              echo "Authenticating the Azure VM to Docker Hub..."

              printf '%s' "$DOCKER_HUB_TOKEN" |
                sshpass -e ssh "${SSH_OPTS[@]}" "$SSH_TARGET" \
                  "docker login \
                    --username '$DOCKER_HUB_USERNAME' \
                    --password-stdin"

              echo "Docker Hub authentication on VM completed."

              sshpass -e ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "
                set -e
                cd '$REMOTE_DIR'

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  config --quiet

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  pull backend frontend

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  up -d --remove-orphans

                docker compose \
                  -f docker-compose.yml \
                  -f docker-compose.ci.yml \
                  ps
              "

              echo "Deployment completed."
            displayName: Authenticate VM and Deploy Stack
            env:
              VM_PASSWORD: $(vmPassword)
              VM_USER: $(vmUser)
              VM_PUBLIC_IP: $(vmPublicIp)
              PROJECT_DIR: $(projectDir)
              DOCKER_HUB_USERNAME: $(dockerHubUsername)
              DOCKER_HUB_TOKEN: $(dockerHubToken)

  # ==========================================================
  # STAGE 3: VERIFY PUBLIC APPLICATION AND BACKEND API
  # ==========================================================

  - stage: Verify
    displayName: Verify EpicBook Deployment
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: VerifyDeployment
        displayName: Verify Nginx and Backend Health
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail

              BASE_URL="http://${VM_PUBLIC_IP}"

              check_endpoint() {
                local path="$1"
                local expected="$2"
                local status

                status=$(curl -sS \
                  --connect-timeout 10 \
                  --max-time 20 \
                  -o /tmp/epicbook-response.txt \
                  -w '%{http_code}' \
                  "$BASE_URL$path") || {
                    echo "FAIL: Cannot reach $BASE_URL$path"
                    return 1
                  }

                printf '%-25s HTTP %s\n' "$path" "$status"

                if [[ "$status" != "$expected" ]]; then
                  echo "FAIL: Expected HTTP $expected for $path"
                  cat /tmp/epicbook-response.txt
                  return 1
                fi

                echo "PASS: $path"
              }

              echo "Waiting for deployment to stabilize..."
              sleep 15

              echo "===== PUBLIC ENDPOINT VERIFICATION ====="
              check_endpoint "/" "200"
              check_endpoint "/health" "200"

              echo
              echo "===== DEPLOYMENT SUMMARY ====="
              echo "Cloud provider : Microsoft Azure"
              echo "VM user        : $VM_USER"
              echo "Public URL     : $BASE_URL/"
              echo "Reverse proxy  : Nginx"
              echo "Image tag      : $IMAGE_TAG"
              echo "Result         : SUCCESS"
            displayName: Verify Public Application and API
            env:
              VM_PUBLIC_IP: $(vmPublicIp)
              VM_USER: $(vmUser)
              IMAGE_TAG: $(imageTag)
